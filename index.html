<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechMart - Product Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>TechMart</h1>
  <button id="cartToggle">Cart <span id="cartBadge" style="display:none">0</span></button>
</header>

<main>

  <h2>Recently Viewed</h2>
  <button class="clear-btn" id="clearRv">Clear History</button>
  <div id="rvArea"></div>

  <h2>Browse Products</h2>
  <div id="tabs"></div>
  <div id="grid"></div>

</main>

<div id="modalOverlay">
  <div id="modalBody"></div>
</div>

<div id="cartOverlay"></div>
<div id="cartPanel">
  <div class="cart-head">
    <h2>Your Cart</h2>
    <button class="clear-btn" id="closeCart">Close</button>
  </div>
  <div class="undo-redo">
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
  </div>
  <div id="cartItems"></div>
  <div class="cart-foot">
    <div>Items: <span id="itemCount">0</span></div>
    <div class="total"><span>Total</span><span id="cartTotal">Rs 0</span></div>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
